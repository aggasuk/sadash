const cvar = i => "var(--c" + (i % 5) + ")";
const OFF = {};                                   // ccy -> {cycleId: true} = switched off
try { Object.assign(OFF, JSON.parse(localStorage.getItem("cyclefw_off") || "{}")); } catch (e) {}
const isOff = (ccy, id) => !!(OFF[ccy] && OFF[ccy][id]);
const act = C => C.cycles.filter(c => !isOff(C.ccy, c.id));
const MED = v => { const q = v.slice().sort((a, b) => a - b), m = q.length;
  return !m ? null : m % 2 ? q[(m - 1) / 2] : (q[m / 2 - 1] + q[m / 2]) / 2; };

function stats(C, t) {
  const pr = t.priced[S.h]; if (pr == null) return null;
  const hz = {spot: t.now};
  const i = gi(P.horizons[S.h]);
  const wk = a => { const xs = []; for (let k = i - 2; k <= i + 2; k++) if (a[k] != null) xs.push(a[k]);   // +/-6 days
    return xs.length ? xs.reduce((p, q) => p + q, 0) / xs.length : null; };
  const medOf = v => { const q = v.slice().sort((a, b) => a - b), m = q.length;
    return !m ? null : m % 2 ? q[(m - 1) / 2] : (q[m / 2 - 1] + q[m / 2]) / 2; };
  const sfNow = t.sofar ? t.sofar.now : null;
  const sfMed = t.sofar ? medOf(act(C).map(c => t.sofar[c.id]).filter(v => v != null)) : null;
  const priced = pr;
  const moves = {}; const vals = [];
  for (const c of act(C)) { const s = t.series[c.id]; const v = s ? wk(s) : null; moves[c.id] = v; if (v != null) vals.push(v); }
  if (vals.length < 1) return {hz, priced, moves, n: 0, sfNow, sfMed};
  const srt = vals.slice().sort((a, b) => a - b), m = srt.length;
  const med = m % 2 ? srt[(m - 1) / 2] : (srt[m / 2 - 1] + srt[m / 2]) / 2;
  const gap = med - priced, sg = Math.sign(gap);
  const beat = vals.filter(v => Math.sign(v - priced) === sg).length;
  let read = null;
  if (Math.abs(gap) >= MIN_GAP && m >= 2 && beat >= Math.max(m - 1, 2)) {
    const pay = gap > 0, fly = t.kind === "fly";
    read = {side: pay ? "pay" : "rec", strong: beat === m,
            txt: fly ? (pay ? "PAY belly · higher than priced" : "REC belly · lower than priced")
                     : (pay ? "PAY · steeper than priced" : "REC · flatter than priced")};
  }
  return {hz, priced, moves, n: m, med, gap, beat, read, sfNow, sfMed};
}

function render() {
  const C = P.ccys[S.ccy], H = P.horizons[S.h];
  GRID = C.grid;
  document.getElementById("ccyseg").innerHTML = Object.keys(P.ccys).map(c =>
    `<button class="${c === S.ccy ? "on" : ""}" data-c="${c}">${c}</button>`).join("");
  document.getElementById("hseg").innerHTML = Object.keys(P.horizons).map(h =>
    `<button class="${h === S.h ? "on" : ""}" data-h="${h}">${h}</button>`).join("");
  document.getElementById("meta").innerHTML =
    `First hike <b>${C.first_hike}</b> &middot; <b>day ${C.D}</b> of the cycle &middot; ` +
    `hikes so far <b>${f0(C.hiked.now)}bp</b> <span title="policy-rate rise by the same day in each past cycle">(past cycles by day ${C.D}: ` +
    C.cycles.map(c => `${c.year} ${f0(C.hiked[c.id])}`).join(" · ") + `)</span> &middot; data as of <b>${C.as_of}</b>`;
  document.getElementById("how").innerHTML =
    (C.D > 0 ? `<b>So far</b> = the move from the first hike to day ${C.D}: this cycle against the median past cycle over the same ${C.D} days. ` : "") +
    `<b>Next ${S.h}</b> = what each past cycle did over the following ${S.h} from that same day ` +
    `(averaged over the week either side, so one day cannot make a call), against what the forward prices today. ` +
    `<b>Gap</b> = median past cycle − priced. A call is shown only when the gap is at least ${MIN_GAP}bp and all the cycles switched on, ` +
    `or all but one (minimum two), would have beaten the forward. All numbers in bp.`;

  const groups = [["spread", "Curves"], ["fly", "Flies"], ["fwd", "Forward spreads"]];
  const A = act(C), SF = C.D > 0, NC = 7 + A.length + (SF ? 2 : 0);
  document.getElementById("cycbar").innerHTML = `<span class="meta">Past cycles used:</span>` +
    C.cycles.map((c, i) => `<button class="chip ${isOff(C.ccy, c.id) ? "off" : ""}" data-y="${c.id}" title="click to switch on/off">` +
      `<i style="background:${cvar(i)}"></i>${c.year} <small>${c.size}</small></button>`).join("") +
    (A.length < C.cycles.length ? `<span class="meta">${A.length} of ${C.cycles.length} on — medians, gaps and calls use only these</span>` : "");
  let h = `<tr class="top"><th colspan="2"></th>` +
    (SF ? `<th colspan="2" class="sepL ctr">So far &middot; first hike → today (${C.D}d)</th>` : "") +
    `<th colspan="${5 + A.length}" class="sepL ctr">Next ${S.h} &middot; from today</th></tr>` +
    `<tr><th>Structure</th><th>Now</th>` +
    (SF ? `<th class="sepL">This cycle</th><th>Past median</th>` : "") +
    `<th class="sepL">Fwd prices</th>` +
    A.map(c => `<th>${c.year}<small>${c.size}</small></th>`).join("") +
    `<th>Median</th><th>Gap</th><th>Beat fwd</th><th>Read</th></tr>`;
  let first = null;
  for (const [k, lab] of groups) {
    const rows = C.trades.filter(t => t.kind === k).map(t => ({t, s: stats(C, t)}))
      .sort((a, b) => (b.s && b.s.read ? 1 : 0) - (a.s && a.s.read ? 1 : 0) ||
                      Math.abs((b.s && b.s.gap) || 0) - Math.abs((a.s && a.s.gap) || 0));
    h += `<tr class="grp"><td colspan="${NC}">${lab}</td></tr>`;
    for (const {t, s} of rows) {
      if (!first && s && s.read) first = t.name;
      if (!s) { h += `<tr class="row" data-t="${t.name}"><td class="name">${nice(t.name)}</td><td colspan="${NC - 1}" class="none" style="text-align:left">no forward-priced move for this horizon</td></tr>`; continue; }
      const sg = Math.sign(s.gap || 0);
      h += `<tr class="row" data-t="${t.name}"><td class="name">${nice(t.name)}</td><td>${lvl(s.hz.spot)}</td>` +
        (SF ? `<td class="sepL sf">${f1(s.sfNow)}</td><td>${f1(s.sfMed)}</td>` : "") + `<td class="sepL">${f1(s.priced)}</td>` +
        A.map((c, i) => { const v = s.moves[c.id];
          const off = v != null && sg && Math.sign(v - s.priced) !== sg;
          return `<td class="cyc ${off ? "off" : ""}">${f1(v)}</td>`; }).join("") +
        `<td>${f1(s.med)}</td><td class="gap">${f1(s.gap)}</td>` +
        `<td>${s.beat == null ? "–" : s.beat + "/" + s.n}</td>` +
        `<td>${s.read ? `<span class="pill ${s.read.side} ${s.read.strong ? "strong" : ""}">${s.read.txt}</span>` : '<span class="none">–</span>'}</td></tr>`;
    }
  }
  document.getElementById("tbl").innerHTML = h;
  if (!S.trade || !C.trades.some(t => t.name === S.trade)) S.trade = first || C.trades[0].name;
  document.querySelectorAll("tr.row").forEach(r => r.classList.toggle("sel", r.dataset.t === S.trade));

  const cav = C.caveats;
  document.getElementById("cav").innerHTML = cav.length
    ? `<summary>Notes for ${S.ccy} (${cav.length}) &middot; generated ${P.generated}</summary><ul>${cav.map(c => `<li>${c}</li>`).join("")}</ul>` : "";
  chart();
}

function chart() {
  const C = P.ccys[S.ccy], t = C.trades.find(x => x.name === S.trade), s = stats(C, t), H = P.horizons[S.h];
  document.getElementById("ctitle").textContent = `${S.ccy} ${nice(t.name)}`;
  document.getElementById("csub").innerHTML = s && s.gap != null
    ? `Move from today, bp. Forward prices <b>${f1(s.priced)}</b> by +${S.h}; the median past cycle did <b>${f1(s.med)}</b> — gap <b>${f1(s.gap)}</b>.`
    : "Move from today, bp.";
  if (s && s.sfNow != null) document.getElementById("csub").innerHTML +=
    ` Since the first hike it has moved <b>${f1(s.sfNow)}</b> (past cycles: median <b>${f1(s.sfMed)}</b>).`;
  const W = 640, Ht = 400, L = 44, R = 62, T = 14, B = 30;
  const x0 = GRID[0], x1 = GRID[GRID.length - 1];
  const all = [];
  const on = act(C).map(c => t.series[c.id]).filter(Boolean);
  const med = GRID.map((_, k) => MED(on.map(a => a[k]).filter(v => v != null)));
  on.forEach(a => a.forEach(v => v != null && all.push(v)));
  (t.next || []).forEach(v => v != null && all.push(v));
  if (s) all.push(s.priced); all.push(0);
  let lo = Math.min(...all), hi = Math.max(...all); const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
  const X = d => L + (d - x0) / (x1 - x0) * (W - L - R), Y = v => T + (hi - v) / (hi - lo) * (Ht - T - B);
  const path = a => { let p = "", pen = false; a.forEach((v, i) => { if (v == null) { pen = false; return; }
    p += (pen ? "L" : "M") + X(GRID[i]).toFixed(1) + " " + Y(v).toFixed(1); pen = true; }); return p; };
  const step = [1, 2, 5, 10, 20, 25, 50, 100, 200].find(k => (hi - lo) / k <= 7) || 500;
  let g = "";
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step)
    g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
  g += `<line x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--dim)" stroke-width="1"/>`;
  const xt = []; for (let d = Math.ceil(x0 / 90) * 90; d <= x1; d += 90) xt.push([d, d === 0 ? "today" : (d > 0 ? "+" : "−") + Math.abs(d) / 30 + "M"]);
  xt.forEach(([d, lab]) =>
    g += `<text x="${X(d)}" y="${Ht - 10}" text-anchor="middle">${lab}</text>`);
  g += `<line x1="${X(0)}" x2="${X(0)}" y1="${T}" y2="${Ht - B}" stroke="var(--now)" stroke-dasharray="3 3"/>`;
  if (C.D > 0 && -C.D >= x0) g += `<line x1="${X(-C.D)}" x2="${X(-C.D)}" y1="${T}" y2="${Ht - B}" stroke="var(--accent)" stroke-dasharray="3 3"/>` +
    `<text x="${X(-C.D)}" y="${T + 9}" text-anchor="end" dx="-4" style="fill:var(--accent)">1st hike</text>`;
  g += `<line x1="${X(H)}" x2="${X(H)}" y1="${T}" y2="${Ht - B}" stroke="var(--dim)" stroke-dasharray="2 4" opacity=".6"/>`;
  const ends = [];
  C.cycles.forEach((c, i) => { const a = t.series[c.id]; if (!a || isOff(C.ccy, c.id)) return;
    g += `<path d="${path(a)}" fill="none" stroke="${cvar(i)}" stroke-width="1.4" opacity=".85"/>`;
    let j = a.length - 1; while (j > 0 && a[j] == null) j--;
    ends.push({y: Y(a[j]), lab: c.year, col: cvar(i)}); });
  g += `<path d="${path(med)}" fill="none" stroke="var(--ink)" stroke-width="2.6"/>`;
  let j = med.length - 1; while (j > 0 && med[j] == null) j--;
  if (med[j] != null) ends.push({y: Y(med[j]), lab: "median", col: "var(--ink)", b: 1});
  if (t.next) g += `<path d="${path(t.next)}" fill="none" stroke="var(--now)" stroke-width="2.6"/>`;
  if (s) {
    g += `<line x1="${X(0)}" y1="${Y(0)}" x2="${X(H)}" y2="${Y(s.priced)}" stroke="var(--now)" stroke-width="2" stroke-dasharray="5 4"/>` +
      `<circle cx="${X(H)}" cy="${Y(s.priced)}" r="5.5" fill="var(--now)" stroke="var(--surface)" stroke-width="1.5"/>`;
    if (s.med != null) {
      const ym = Y(s.med), yp = Y(s.priced), col = s.read ? `var(--${s.read.side})` : "var(--dim)";
      g += `<circle cx="${X(H)}" cy="${ym}" r="4" fill="var(--ink)"/>` +
        `<line x1="${X(H) + 9}" x2="${X(H) + 9}" y1="${ym}" y2="${yp}" stroke="${col}" stroke-width="2"/>` +
        `<text x="${X(H) + 14}" y="${(ym + yp) / 2 + 4}" style="fill:${col};font-weight:700;font-size:12px">gap ${f1(s.gap)}</text>`;
    }
  }
  ends.sort((a, b) => a.y - b.y);
  for (let k = 1; k < ends.length; k++) if (ends[k].y - ends[k - 1].y < 13) ends[k].y = ends[k - 1].y + 13;
  ends.forEach(e => g += `<text x="${W - R + 6}" y="${e.y + 4}" style="fill:${e.col};font-weight:${e.b ? 700 : 500}">${e.lab}</text>`);
  document.getElementById("chart").innerHTML = `<svg viewBox="0 0 ${W} ${Ht}" role="img">${g}</svg>`;
  document.getElementById("legend").innerHTML =
    `<span><i style="border-color:var(--now)"></i>this cycle</span>` +
    `<span><i style="border-color:var(--now);border-top-style:dashed"></i>forward-priced path to +${S.h}</span>` +
    `<span><i style="border-color:var(--ink)"></i>median of past cycles</span>` +
    `<span>thin lines = each past cycle from the same day</span>`;
}

document.addEventListener("click", e => {
  const b = e.target.closest("button"), r = e.target.closest("tr.row");
  if (b && b.dataset.c) { S.ccy = b.dataset.c; S.trade = null; render(); }
  else if (b && b.dataset.h) { S.h = b.dataset.h; render(); }
  else if (b && b.dataset.y) { const C = P.ccys[S.ccy], id = b.dataset.y, o = OFF[S.ccy] = OFF[S.ccy] || {};
    if (!o[id] && act(C).length <= 1) return;            // keep at least one cycle on
    if (o[id]) delete o[id]; else o[id] = true;
    try { localStorage.setItem("cyclefw_off", JSON.stringify(OFF)); } catch (e) {}
    render(); }
  else if (r) { S.trade = r.dataset.t; document.querySelectorAll("tr.row").forEach(x => x.classList.toggle("sel", x === r)); chart(); }
});
render();
// embedded in the dashboard: size the iframe to the content (same-origin only)
(function(){ const fit = () => { try { if (window.frameElement && document.body.scrollHeight > 200)
    window.frameElement.style.height = (document.body.scrollHeight + 40) + "px"; } catch (e) {} };
  try { new ResizeObserver(fit).observe(document.body); } catch (e) {} fit(); })();
</script></body></html>
