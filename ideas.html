<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ideas</title>
<style>
:root{--bg:#f4f5f8;--surface:#fff;--surface2:#edeff4;--border:#d9dde6;--ink:#1c1f2a;--dim:#6b7280;--accent:#5b52e6;
  --good:#15803d;--bad:#c2410c;--warn:#b45309;--tested:#15803d;--small:#2563eb;--untested:#6b7280;--failed:#9f1239}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1117;--surface:#171a23;--surface2:#1f2330;
  --border:#2c3142;--ink:#e3e6ee;--dim:#8b93a5;--accent:#8f88ff;--good:#4ade80;--bad:#fb923c;--warn:#fbbf24;
  --tested:#4ade80;--small:#7aa7ff;--untested:#8b93a5;--failed:#fb7185}}
:root[data-theme="dark"]{--bg:#0f1117;--surface:#171a23;--surface2:#1f2330;--border:#2c3142;--ink:#e3e6ee;--dim:#8b93a5;
  --accent:#8f88ff;--good:#4ade80;--bad:#fb923c;--warn:#fbbf24;--tested:#4ade80;--small:#7aa7ff;--untested:#8b93a5;--failed:#fb7185}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);
  line-height:1.45;padding:16px;font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chipb{font:inherit;font-size:13px;padding:5px 12px;border:1px solid var(--border);border-radius:999px;background:var(--surface);
  color:var(--dim);cursor:pointer}
.chipb.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.meta{font-size:12.5px;color:var(--dim)} .meta b{color:var(--ink)}
.feeds{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--dim);margin:0 0 10px}
.feeds .bad{color:var(--warn);font-weight:600}
h2{font-size:15px;margin:20px 0 4px} h2 small{font-weight:400;color:var(--dim);font-size:12.5px;margin-left:6px}
.sub{font-size:12.5px;color:var(--dim);margin-bottom:8px;max-width:1000px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px 12px;margin-bottom:8px}
.idea{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;
  padding:12px 14px;margin-bottom:10px;cursor:pointer}
.idea.SINGLE{border-left-color:var(--small)} .idea.CONFLICTED{border-left-color:var(--warn)}
.idea .top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.idea .title{font-size:16px;font-weight:700}
.idea .ev{margin-top:6px}
.idea .best{margin-top:6px;font-size:13.5px} .idea .best b{font-weight:650}
.idea .lv{color:var(--dim);font-variant-numeric:tabular-nums}
.idea .more{font-size:12px;color:var(--dim);margin-top:4px}
.det{margin-top:10px;padding-top:10px;border-top:1px solid var(--surface2);font-size:12.5px;color:var(--dim);cursor:default}
.det b{color:var(--ink)} .det ul{margin:2px 0 8px 18px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;text-align:left;
  padding:7px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--surface2);vertical-align:top}
tr.row{cursor:pointer} tr.row:hover td{background:var(--surface2)}
td.trade{font-weight:600} td.trade small{display:block;font-weight:400;color:var(--dim)}
td.num{white-space:nowrap}
.f{display:inline-block;white-space:nowrap;font-size:11.5px;font-weight:600;border-radius:5px;padding:1px 7px;margin:0 4px 3px 0;border:1px solid}
.f.tested{color:var(--tested)} .f.small{color:var(--small)} .f.untested{color:var(--untested);border-style:dashed;font-weight:500}
.f.failed{color:var(--failed);border-style:dashed;font-weight:500}
.flag{color:var(--warn);font-size:12.5px;margin-top:4px}
tr.rdet td{background:var(--surface2);font-size:12.5px;color:var(--dim);padding:8px 14px 10px}
tr.rdet ul{margin:2px 0 6px 18px} tr.rdet b{color:var(--ink)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.legend{font-size:12px;color:var(--dim);margin:4px 0 6px}
.empty{color:var(--dim);font-size:13px;padding:10px 4px}
</style></head><body>
<div class="bar" id="filters"></div>

  <span class="f untested">untested</span> a fit with no test behind it
  <span class="f failed">failed</span> fails its own test, not counted. Click anything for the detail.</div>

(function(){ let pt = null;
  try { if (window.parent && window.parent !== window) { pt = () => window.parent.document.documentElement.getAttribute("data-theme");

const CLS = [["all", "All"], ["rates", "Rates"], ["fx", "FX"], ["eq", "Equities"], ["cmd", "Commodities"]];
const TIERS = [
  ["IDEA", "Ideas", "Different kinds of evidence, or several separately tested models, point the same way and nothing with a track record disagrees."],
  ["SINGLE", "Single-source ideas", "One tested signal on its own."],
  ["CONFLICTED", "Conflicted", "Evidence with a track record on both sides. Listed because the disagreement is worth knowing."]];
const S = {cls: "all", open: {}, scr: {}};
const esc = s => String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));
const glab = g => g === "small" ? "thin record" : g;
const inCls = c => S.cls === "all" || c === S.cls || (S.cls === "rates" && c === "rv");
const lv = x => [x.now_s ? "now " + x.now_s : null, x.target_s ? "target " + x.target_s : null,
                 x.stop_s ? "wrong beyond " + x.stop_s : null].filter(Boolean).join(" · ");
function idea(x) {
  const chips = x.families.map(f => `<span class="f ${f.grade}">${esc(f.label)}${f.n > 1 ? " ×" + f.n : ""}</span>`).join("");
  const b = x.best;
  let h = `<div class="idea ${x.tier}" data-id="${esc(x.id)}"><div class="top"><span class="title">${esc(x.title)}</span></div>` +
    `<div class="ev">${chips}${x.against.length ? `<span class="f failed">${x.against.length} the other way</span>` : ""}</div>` +
    `<div class="best">Best expression: <b>${esc(b.trade)}</b> <span class="lv">${esc(lv(b))}${b.horizon ? " · " + esc(b.horizon) : ""}</span></div>` +
    (x.n_expr > 1 ? `<div class="more">${x.n_expr - 1} other way${x.n_expr > 2 ? "s" : ""} to express it</div>` : "") +
    x.warnings.map(w => `<div class="flag">⚠ ${esc(w)}</div>`).join("");
  if (S.open[x.id]) {
    h += `<div class="det">`;
    if (x.others.length) h += `<b>Other expressions</b><ul>${x.others.map(o => `<li><b>${esc(o.trade)}</b> ${esc(lv(o))}${o.warnings.length ? " — ⚠ " + esc(o.warnings.join("; ")) : ""}</li>`).join("")}</ul>`;
    h += `<b>Evidence for</b><ul>${x.families.map(f => f.items.map(i => `<li><b>${esc(f.label)}</b> (${glab(f.grade)}) ${esc(i)}</li>`).join("")).join("")}</ul>`;
    if (x.against.length) h += `<b>The other way</b><ul>${x.against.map(a => `<li><b>${esc(a.label)}</b> (${glab(a.grade)}) ${esc(a.text)}</li>`).join("")}</ul>`;
    if (x.notes.length) h += `<b>Context</b><ul>${x.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>`;
    if (x.related.length) h += `<b>Overlaps with</b><ul>${x.related.map(n => `<li>${esc(n)}</li>`).join("")}</ul>`;
    h += `</div>`;

}
function row(x) {
  const seen = {}; const chips = x.families.filter(f => !seen[f.fam + f.grade] && (seen[f.fam + f.grade] = 1))
    .map(f => `<span class="f ${f.grade}" title="${esc(f.evid || "")}">${esc(f.label)}</span>`).join("");
  let h = `<tr class="row" data-id="${esc(x.id)}"><td class="trade">${esc(x.trade)}<small>${esc(x.theme_title || x.label)}` +
    `${x.similar && x.similar.length ? " · +" + x.similar.length + " similar" : ""}</small></td><td>${chips}</td>` +
    `<td class="num">${esc(lv(x)) || "–"}</td><td>${x.warnings.map(w => `<span class="flag">⚠ ${esc(w)}</span>`).join("") || "–"}</td></tr>`;
  if (S.open[x.id]) {
    const li = a => a.map(f => `<li><b>${esc(f.label)}</b> (${glab(f.grade)}): ${esc(f.text)}${f.evid ? " — " + esc(f.evid) : ""}</li>`).join("");
    h += `<tr class="rdet"><td colspan="4"><b>For</b><ul>${li(x.families)}</ul>` +

      (x.similar && x.similar.length ? `<b>Similar structures the same model flags</b><ul>${x.similar.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : "") +
      (x.notes.length ? `<b>Context</b><ul>${x.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : "") + `</td></tr>`;
  }
  return h;
}
function render() {
  document.getElementById("filters").innerHTML = CLS.map(([k, l]) => {

    return `<button class="chipb ${S.cls === k ? "on" : ""}" data-k="${k}">${l}${n ? " · " + n : ""}</button>`; }).join("");
  document.getElementById("meta").innerHTML = `Built <b>${esc(P._updated)}</b> · <b>${P.counts.IDEA}</b> ideas · <b>${P.counts.SINGLE}</b> single-source · ` +

  document.getElementById("feeds").innerHTML = P.status.map(s =>

  let h = "";
  for (const [t, title, sub] of TIERS) {
    const xs = P.ideas.filter(x => x.tier === t && inCls(x.cls));
    if (!xs.length && t !== "IDEA") continue;
    h += `<h2>${title}<small>${xs.length}</small></h2><div class="sub">${sub}</div>`;
    h += xs.length ? xs.map(idea).join("") : `<div class="card"><div class="empty">Nothing here right now.</div></div>`;
  }
  h += `<h2 style="margin-top:28px">Screens</h2><div class="sub">Single thin or untested signals, grouped by source and by theme. Useful to browse; none of these is an idea on its own.</div>`;
  for (const sc of P.screens) {
    const xs = sc.rows.filter(x => inCls(x.cls));

    const on = !!S.scr[sc.key];
    h += `<h2 style="font-size:14px;margin-top:12px">${esc(sc.title)}<small>${xs.length}</small> <button class="chipb" data-s="${sc.key}" style="margin-left:8px;font-size:12px;padding:2px 10px">${on ? "hide" : "show"}</button></h2>`;
    if (!on) continue;
    h += `<div class="sub">${esc(sc.sub)}</div><div class="card"><div class="tblwrap"><table><tr><th>Trade</th><th>Evidence</th><th>Levels</th><th>Flags</th></tr>${xs.map(row).join("")}</table></div></div>`;
  }
  const sc = P.scorecard;
  h += `<h2 style="margin-top:28px">Scorecard<small>${sc.open.length} tracked · ${sc.closed_n} closed</small></h2><div class="sub">Each idea's best expression is logged at the level it first appeared and marked each run. Paper only; it shows which kinds of evidence pay.</div><div class="card"><div class="tblwrap">`;
  const pn = (v, u) => v == null ? "–" : `<span class="${v > 0 ? "pos" : v < 0 ? "neg" : ""}">${v > 0 ? "+" : ""}${v}${u === "px" ? "%" : "bp"}</span>`;
  h += sc.open.length ? `<table><tr><th>Trade</th><th>Idea</th><th>First seen</th><th>Days</th><th>Since then</th></tr>` +
    sc.open.map(o => `<tr><td class="trade">${esc(o.trade)}</td><td>${esc(o.theme || "")}</td><td>${esc(o.first)}</td><td>${o.days}</td><td>${pn(o.pnl, o.unit)}</td></tr>`).join("") + `</table>`
    : `<div class="empty">Nothing tracked yet.</div>`;
  if (sc.by_family.length) h += `<table style="margin-top:8px"><tr><th>Closed, by source</th><th>n</th><th>Winners</th><th>Total</th></tr>` +
    sc.by_family.map(f => `<tr><td>${esc(f.family)}</td><td>${f.n}</td><td>${f.wins}</td><td>${f.total > 0 ? "+" : ""}${f.total}${f.unit}</td></tr>`).join("") + `</table>`;
  h += `</div></div>`;
  document.getElementById("body").innerHTML = h;
}
document.addEventListener("click", e => {
  const b = e.target.closest("button[data-k]"), s = e.target.closest("button[data-s]");
  const c = e.target.closest(".idea"), r = e.target.closest("tr.row");
  if (b) { S.cls = b.dataset.k; render(); }
  else if (s) { S.scr[s.dataset.s] = !S.scr[s.dataset.s]; render(); }
  else if (e.target.closest(".det")) { return; }
  else if (c) { S.open[c.dataset.id] = !S.open[c.dataset.id]; render(); }
  else if (r) { S.open[r.dataset.id] = !S.open[r.dataset.id]; render(); }
});
render();
(function(){ const fit = () => { try { if (window.frameElement && document.body.scrollHeight > 200)
