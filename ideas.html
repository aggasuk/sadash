<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ideas</title>
<style>
:root{--bg:#f4f5f8;--surface:#fff;--surface2:#edeff4;--border:#d9dde6;--ink:#1c1f2a;--dim:#6b7280;--accent:#5b52e6;
  --good:#15803d;--bad:#c2410c;--warn:#b45309;--tested:#15803d;--small:#2563eb;--untested:#6b7280;--failed:#9f1239}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1117;--surface:#171a23;--surface2:#1f2330;
  --border:#2c3142;--ink:#e3e6ee;--dim:#8b93a5;--accent:#8f88ff;--good:#4ade80;--bad:#fb923c;--warn:#fbbf24;
  --tested:#4ade80;--small:#7aa7ff;--untested:#8b93a5;--failed:#fb7185}}
:root[data-theme="dark"]{--bg:#0f1117;--surface:#171a23;--surface2:#1f2330;--border:#2c3142;--ink:#e3e6ee;--dim:#8b93a5;
  --accent:#8f88ff;--good:#4ade80;--bad:#fb923c;--warn:#fbbf24;--tested:#4ade80;--small:#7aa7ff;--untested:#8b93a5;--failed:#fb7185}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);
  line-height:1.45;padding:16px;font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chipb{font:inherit;font-size:13px;padding:5px 12px;border:1px solid var(--border);border-radius:999px;background:var(--surface);
  color:var(--dim);cursor:pointer}
.chipb.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.meta{font-size:12.5px;color:var(--dim)} .meta b{color:var(--ink)}
.feeds{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--dim);margin:0 0 14px}
.feeds .bad{color:var(--warn);font-weight:600}
h2{font-size:15px;margin:18px 0 4px} h2 small{font-weight:400;color:var(--dim);font-size:12.5px;margin-left:6px}
.sub{font-size:12.5px;color:var(--dim);margin-bottom:8px;max-width:1000px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px 12px;margin-bottom:8px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;text-align:left;
  padding:7px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--surface2);vertical-align:top}
tr.row{cursor:pointer} tr.row:hover td{background:var(--surface2)}
td.trade{font-weight:600;white-space:nowrap} td.trade small{display:block;font-weight:400;color:var(--dim)}
td.num{white-space:nowrap}
.f{display:inline-block;white-space:nowrap;font-size:11.5px;font-weight:600;border-radius:5px;padding:1px 7px;margin:0 4px 3px 0;border:1px solid}
.f.tested{color:var(--tested)} .f.small{color:var(--small)} .f.untested{color:var(--untested);border-style:dashed;font-weight:500}
.f.failed{color:var(--failed);border-style:dashed;font-weight:500;text-decoration:line-through}
.flag{color:var(--warn);font-size:12px}
tr.det td{background:var(--surface2);font-size:12.5px;color:var(--dim);padding:8px 14px 10px}
tr.det ul{margin:2px 0 6px 18px} tr.det b{color:var(--ink)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.legend{font-size:12px;color:var(--dim);margin:4px 0 12px}
.empty{color:var(--dim);font-size:13px;padding:10px 4px}
</style></head><body>

  <span class="f failed">failed</span> fails its own test, not counted. Click a row for the detail.</div>

  ["SINGLE", "Single-source ideas", "One kind of evidence, but one that has passed a test or has a solid record of its own."],
  ["CONFLICTED", "Conflicted", "Evidence with a track record on both sides. Listed because the disagreement is worth knowing."],
  ["WATCH", "Watch", "Untested fits at 1.5 sigma or more, lone thin signals, and equity capitulation that has not turned."]];
const S = {cls: "all", open: {}, watch: false};
const esc = s => String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));
const glab = g => g === "small" ? "thin record" : g;
function fam(f, cls) { return `<span class="f ${f.grade}" title="${esc(f.evid || "")}">${esc(f.label)}</span>`; }
function row(x) {
  const lv = [x.now_s ? "now " + x.now_s : null, x.target_s ? "target " + x.target_s : null, x.stop_s ? "wrong beyond " + x.stop_s : null].filter(Boolean).join(" · ");
  const seen = {}; const chips = x.families.filter(f => !seen[f.fam + f.grade] && (seen[f.fam + f.grade] = 1)).map(f => fam(f)).join("");
  const flags = x.warnings.map(w => `<div class="flag">⚠ ${esc(w)}</div>`).join("");
  let h = `<tr class="row" data-id="${esc(x.id)}"><td class="trade">${esc(x.trade)}<small>${esc(x.label)}</small></td>` +
    `<td>${chips}${x.against.length ? `<span class="f failed" style="text-decoration:none" title="signals the other way">${x.against.length} against</span>` : ""}</td>` +
    `<td class="num">${esc(lv) || "–"}</td><td>${esc(x.horizon || "–")}</td><td>${flags || "–"}</td></tr>`;
  if (S.open[x.id]) {
    const li = a => a.map(f => `<li><b>${esc(f.label)}</b> (${glab(f.grade)}): ${esc(f.text)}${f.evid ? " — " + esc(f.evid) : ""}</li>`).join("");
    h += `<tr class="det"><td colspan="5"><b>For</b><ul>${li(x.families)}</ul>` +
      (x.against.length ? `<b>Against</b><ul>${li(x.against)}</ul>` : "") +
      (x.notes.length ? `<b>Context</b><ul>${x.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : "") +
      (x.related.length ? `<b>Likely the same bet as</b><ul>${x.related.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : "") + `</td></tr>`;
  }
  return h;
}
function render() {
  document.getElementById("filters").innerHTML = CLS.map(([k, l]) => {
    const n = P.ideas.filter(x => (k === "all" || x.cls === k) && (x.tier === "IDEA" || x.tier === "SINGLE")).length;
    return `<button class="chipb ${S.cls === k ? "on" : ""}" data-k="${k}">${l}${n ? " · " + n : ""}</button>`; }).join("");
  document.getElementById("meta").innerHTML = `Built <b>${esc(P._updated)}</b> · <b>${P.counts.IDEA}</b> ideas · <b>${P.counts.SINGLE}</b> single-source · ` +
    `${P.counts.CONFLICTED} conflicted · ${P.counts.WATCH} on watch`;
  document.getElementById("feeds").innerHTML = P.status.map(s =>
    `<span class="${s.ok ? "" : "bad"}">${esc(s.name)}: ${esc(s.asof)}${s.note ? " (" + esc(s.note) + ")" : ""}</span>`).join("");
  let h = "";
  for (const [t, title, sub] of TIERS) {
    const xs = P.ideas.filter(x => x.tier === t && (S.cls === "all" || x.cls === S.cls));
    const hide = t === "WATCH" && !S.watch && xs.length > 0;
    h += `<h2>${title}<small>${xs.length}</small>${t === "WATCH" && xs.length ? ` <button class="chipb" data-w="1" style="margin-left:8px;font-weight:400">${S.watch ? "hide" : "show"}</button>` : ""}</h2><div class="sub">${sub}</div>`;
    if (hide) continue;
    h += `<div class="card"><div class="tblwrap">`;
    h += xs.length ? `<table><tr><th>Trade</th><th>Evidence</th><th>Levels</th><th>Horizon</th><th>Flags</th></tr>${xs.map(row).join("")}</table>`
                   : `<div class="empty">Nothing here right now.</div>`;
    h += `</div></div>`;
  }
  const sc = P.scorecard;
  h += `<h2>Scorecard<small>${sc.open.length} tracked · ${sc.closed_n} closed</small></h2><div class="sub">Every idea and single-source idea is logged at the level it first appeared and marked each run. Paper only; it shows which kinds of evidence pay.</div><div class="card"><div class="tblwrap">`;
  const pn = (v, u) => v == null ? "–" : `<span class="${v > 0 ? "pos" : v < 0 ? "neg" : ""}">${v > 0 ? "+" : ""}${v}${u === "px" ? "%" : "bp"}</span>`;
  h += sc.open.length ? `<table><tr><th>Trade</th><th>Source</th><th>First seen</th><th>Days</th><th>Since then</th></tr>` +
    sc.open.map(o => `<tr><td class="trade">${esc(o.trade)}</td><td>${esc(o.family)}</td><td>${esc(o.first)}</td><td>${o.days}</td><td>${pn(o.pnl, o.unit)}</td></tr>`).join("") + `</table>`
    : `<div class="empty">Nothing tracked yet.</div>`;
  if (sc.by_family.length) h += `<table style="margin-top:8px"><tr><th>Closed, by source</th><th>n</th><th>Winners</th><th>Total</th></tr>` +
    sc.by_family.map(f => `<tr><td>${esc(f.family)}</td><td>${f.n}</td><td>${f.wins}</td><td>${f.total > 0 ? "+" : ""}${f.total}${f.unit}</td></tr>`).join("") + `</table>`;
  h += `</div></div>`;
  document.getElementById("body").innerHTML = h;
}
document.addEventListener("click", e => {
  const b = e.target.closest("button[data-k]"), r = e.target.closest("tr.row");
  const w = e.target.closest("button[data-w]");
  if (w) { S.watch = !S.watch; render(); }
  else if (b) { S.cls = b.dataset.k; render(); }
  else if (r) { S.open[r.dataset.id] = !S.open[r.dataset.id]; render(); }
});
render();
(function(){ const fit = () => { try { if (window.frameElement && document.body.scrollHeight > 200)
    window.frameElement.style.height = (document.body.scrollHeight + 40) + "px"; } catch (e) {} };
  try { new ResizeObserver(fit).observe(document.body); } catch (e) {} fit(); })();
</script></body></html>
